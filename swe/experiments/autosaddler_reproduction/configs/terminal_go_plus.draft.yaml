# Preliminary budget: freeze after train-only Go Plus calibration.
# Final pilot proposal: --n-test 5 --test-repetitions 1 (10 H0/H1 executions).
# Go Plus auth, allowance control and real optimizer integration are pending.
schema_version: autosaddler/v2
scenario:
  type: shared_opencode
  settings:
    mode: real
    launch_ready: false
    benchmarks: [terminal_bench_2]
    case_selection_seed: 42
    capability_phase_iterations: 2
    batch_per_benchmark: 2
    train_per_benchmark: 4
    development_per_benchmark: 3
    target_model: opencode-go/qwen3.7-plus
optimization:
  task_selection: {type: balanced_benchmarks, batch_size: 2, seed: 42}
  acceptance: {type: matched_valid_strict_improvement}
  development: {type: full_on_accept}
  ranking: {type: macro_benchmark_development}
  budget: {max_rollouts: 31, max_iterations: 4}
  diagnosis_patch_timeout_seconds: 1200
  session_retries: 0
provider:
  type: opencode_acp
  capabilities: [read_workspace, edit_workspace, run_commands, load_skills]
  settings:
    model: opencode-go/kimi-k2.7-code
storage:
  type: local
  run_root: ../../../results/autosaddler_reproduction/runs
